# 主节点（控制器 + 管理面板）。附加根节点见 README「多根节点」
services:
  ztplanet:
    build: .
    image: zerotier-planet:latest
    container_name: ztplanet
    restart: unless-stopped
    environment:
      MODE: controller
      IP_ADDR4: ""          # 公网 IPv4，留空自动探测
      IP_ADDR6: ""          # 公网 IPv6，可留空
      ZT_PORT: 9994
      API_PORT: 3443
      FILE_SERVER_PORT: 3000
      BASE_PATH: ""         # 反向代理子路径，例如 /zerotier
      ADMIN_PASSWORD: ""    # 留空则初始密码为 password，首次登录强制修改
    ports:
      - "9994:9994/udp"
      - "9994:9994/tcp"
      - "3443:3443"
      - "3000:3000"
    volumes:
      - ./data/zerotier/one:/var/lib/zerotier-one
      - ./data/zerotier/config:/app/config
      - ./data/zerotier/dist:/app/dist
